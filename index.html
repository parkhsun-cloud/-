<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 우리반 게임 아케이드</title>
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #fff3b0 0%, #ffcbf2 50%, #e0c3fc 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --primary-color: #ff3b00;
            --secondary-color: #7209b7;
            --accent-color: #4cc9f0;
            --text-color: #2b2d42;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: var(--bg-grad);
            min-height: 100vh;
            color: var(--text-color);
            padding: 40px 20px;
        }

        header {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 35px auto;
        }

        .title-badge {
            display: inline-block;
            background: #ffe600;
            color: #000;
            font-weight: 800;
            font-size: 0.9rem;
            padding: 6px 16px;
            border-radius: 20px;
            box-shadow: 0 4px 0 #d4be00;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--secondary-color);
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #fff;
        }

        header p {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .search-box {
            position: relative;
            max-width: 480px;
            margin: 0 auto;
        }

        .search-box input {
            width: 100%;
            padding: 16px 24px;
            font-size: 1rem;
            border: 3px solid #fff;
            border-radius: 35px;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 6px 25px rgba(76, 201, 240, 0.3);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 3px solid #ffffff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(114, 9, 183, 0.15);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .no-badge {
            background: var(--secondary-color);
            color: #fff;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 12px;
        }

        .student-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: 6px;
        }

        .game-title {
            font-size: 1rem;
            font-weight: 600;
            color: #4a4e69;
            line-height: 1.4;
            min-height: 2.8em;
            margin-bottom: 20px;
        }

        .play-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #ff595e, #ff924c);
            color: #fff;
            text-decoration: none;
            padding: 14px 0;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(255, 89, 94, 0.3);
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(255, 89, 94, 0.4);
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="title-badge">🎮 우리반 미니게임 시공간</div>
        <h1>친구들이 만든 게임을 플레이해 보세요!</h1>
        <p>원하는 게임을 검색하거나 버튼을 눌러 플레이할 수 있습니다.</p>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="학생 이름 또는 게임 제목으로 검색..." onkeyup="filterGames()">
        </div>
    </header>

    <main class="grid-container" id="gameGrid"></main>

    <script>
        // 제출된 학생 파일 및 정보 목록
        const games = [
            { no: "04", name: "김소은", title: "나의 작은 동물마을 🐾", file: "4김소은동물마을_미니게임-2.html" },
            { no: "05", name: "김지용", title: "KBO / WBC 야구 게임 ⚾", file: "5김지용gemini-code-1790035776868.html" },
            { no: "06", name: "김하율", title: "태권도 챔피언 - 회전발차기 🥋", file: "6김하율taekwondo_champion_rotation_kicks-1.html" },
            { no: "07", name: "김현아", title: "신나는 카트 대배틀 레이싱! 🏎️", file: "7김현아gemini-code-1789949967748.html" },
            { no: "11", name: "백예나", title: "알록달록 나의 카페 ☕", file: "11백예나alokdalok_cafe_fixed-1.html" },
            { no: "14", name: "우아한", title: "블록 팡! 🧩", file: "14우아한block_pung_game-1.html" },
            { no: "17", name: "조채원", title: "별 먹기 대모험! ⭐", file: "17조채원star_game.html" },
            { no: "20", name: "최은서", title: "블록 게임 🧱", file: "20최은서 block-blast.html" },
            { no: "21", name: "최지윤", title: "강아지 키우기 🐶", file: "21최지윤puppy_game.html" },
            { no: "23", name: "홍아현", title: "피구 피하기 게임 🏐", file: "23홍아현pigu_pihagi_game-1.html" }
        ];

        function renderGames(data) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            data.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-top">
                            <span class="no-badge">NO. ${game.no}</span>
                        </div>
                        <div class="student-name">${game.name}</div>
                        <div class="game-title">${game.title}</div>
                    </div>
                    <a href="${encodeURI(game.file)}" class="play-btn" target="_blank">
                        <span>게임 플레이</span> ➔
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        function filterGames() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = games.filter(g => 
                g.name.toLowerCase().includes(query) || 
                g.title.toLowerCase().includes(query)
            );
            renderGames(filtered);
        }

        renderGames(games);
    </script>
</body>
</html>
